spring.application.name=pgswitch
server.port=9095

### --- Database (MongoDB) ---
## 1. Use a simplified URI (Host and Port only)
#spring.data.mongodb.host=91.108.104.214
#spring.data.mongodb.port=27016
#
## 2. Specify the target database
#spring.data.mongodb.database=pg_switch
#
## 3. Specify credentials for authentication
#spring.data.mongodb.username=mongo
#spring.data.mongodb.password=root
#
## 4. Specify the database where the user is defined (Crucial for successful login)
#spring.data.mongodb.authentication-database=admin

# --- Database (MongoDB) - Connection Configuration ---
# Try different connection approaches

#Option 1: Local MongoDB for testing (uncomment to use)
#spring.data.mongodb.uri=mongodb://localhost:27017/psp


spring.data.mongodb.host=91.108.104.214
spring.data.mongodb.port=27016
spring.data.mongodb.database=pg_switch
spring.data.mongodb.username=mongo
spring.data.mongodb.password=root
spring.data.mongodb.authentication-database=admin






# --- MongoDB Query Logging ---
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.mongodb.core.query.Query=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.mongodb.driver=DEBUG
logging.level.org.mongodb.driver.connection=DEBUG
logging.level.org.mongodb.driver.cluster=DEBUG

# --- File upload (limits) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# --- Storage (KYC uploads) ---
app.storage.base-dir=./storage
app.storage.kyc-dir=./storage/kyc

# --- Crypto (JCE-based encryption with generated keys) ---
app.crypto.master-key-base64=LWbHHsadkgYc9wJ5AzXDQbAlCeOGLbDG+VlJ2bhCqeM=
app.crypto.key-rotation-ids=

# --- Security headers (basic hardening) ---
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Swagger/OpenAPI Configuration ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.displayOperationId=true
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.showExtensions=true
springdoc.swagger-ui.showCommonExtensions=true
springdoc.swagger-ui.supportedSubmitMethods=get,post,put,delete,patch
springdoc.swagger-ui.validatorUrl=
springdoc.swagger-ui.configUrl=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.deepLinking=true
springdoc.swagger-ui.showRequestHeaders=true
springdoc.swagger-ui.requestTimeout=10000
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.layout=StandaloneLayout
springdoc.swagger-ui.plugins=SwaggerUIBundle
springdoc.swagger-ui.presets=SwaggerUIBundle.presets.apis,SwaggerUIBundle.presets.standalone
springdoc.swagger-ui.theme=flattop
springdoc.swagger-ui.title=PGSwitch API Documentation
springdoc.swagger-ui.description=PGSwitch Merchant Registration API with comprehensive security features
springdoc.swagger-ui.version=1.0.0
springdoc.swagger-ui.contact.name=PGSwitch Development Team
springdoc.swagger-ui.contact.email=support@pgswitch.com
springdoc.swagger-ui.contact.url=https://pgswitch.com
springdoc.swagger-ui.license.name=Proprietary
springdoc.swagger-ui.license.url=https://pgswitch.com/license
springdoc.swagger-ui.servers[0].url=http://localhost:9095
springdoc.swagger-ui.servers[0].description=Local Development Server
springdoc.swagger-ui.servers[1].url=https://api.pgswitch.com
springdoc.swagger-ui.servers[1].description=Production Server
springdoc.swagger-ui.tags[0].name=Merchant Applications
springdoc.swagger-ui.tags[0].description=Operations for merchant registration and management
springdoc.swagger-ui.tags[1].name=Key Management
springdoc.swagger-ui.tags[1].description=Cryptographic key generation and management operations
springdoc.swagger-ui.tags[2].name=Health Check
springdoc.swagger-ui.tags[2].description=Application health and status endpoints

