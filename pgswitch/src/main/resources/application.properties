spring.application.name=pgswitch
server.port=9095

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/ory_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


keto.read-api=http://localhost:4466
keto.write-api=http://localhost:4467

spring.main.allow-bean-definition-overriding=true


# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5433/ory_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (optional - used if you switch to JPA repositories)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cognito / OAuth2 Resource Server configuration
# Set this to your Cognito issuer URL, e.g. https://cognito-idp.<region>.amazonaws.com/<userPoolId>
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_It4lQ72rX




# --- MongoDB Query Logging ---
#logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
#logging.level.org.springframework.data.mongodb.core.query.Query=DEBUG
